name: Weekly report
on:
  schedule:
    - cron: "43 15 * * 1"   # Mondays 15:43 UTC = 7:43am Pacific (8:43am during daylight time)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: tracker
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build and send the weekly report
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          WEEKLY_TO: ${{ secrets.WEEKLY_TO }}
        run: python weekly.py
      - name: Save report
        run: |
          git config user.name "ski-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "weekly report $(date -u +%F)"
          git pull --rebase --quiet && git push
