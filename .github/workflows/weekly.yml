name: Weekly report
# The real Monday report is sent automatically by the hourly "Track viral posts" run (it retries the
# AI summary every hour for up to 24h). This workflow is for sending a copy by hand / testing.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the report but don't email it"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: tracker
jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build and send the weekly report
        env:
          PYTHONUNBUFFERED: "1"
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          WEEKLY_TO: ${{ secrets.WEEKLY_TO }}
        run: python weekly.py ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save report
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "ski-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "weekly report $(date -u +%F)"
          git pull --rebase --quiet && git push
